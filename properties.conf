# HGincome global settings. This is trusted Bash code.
HONEYGAIN_IMAGE='honeygain/honeygain:latest'
TUN2PROXY_IMAGE='ghcr.io/tun2proxy/tun2proxy:v0.8.5'
TUN2PROXY_DNS_MODE='over-tcp' # over-tcp, virtual, or direct

# Every account defaults to 10 slots; the hard maximum is 10.
DEVICES_PER_ACCOUNT=10

# Set true only after reviewing and accepting Honeygain's current terms.
# Starting passes -tou-accept to the official Honeygain container.
ACCEPT_TOU=false

RESTART_POLICY='unless-stopped'
ENABLE_LOGS=true
LOG_MAX_SIZE='5m'
LOG_MAX_FILES=2
TUNNEL_START_TIMEOUT=20
DOCKER_BIN='docker'
